# Dependabot version updates. Security fixes come from the repo's
# "Dependabot security updates" setting and do not need an entry here.
#
# This is a pnpm workspace with a single root lockfile, so one npm entry at /
# covers the root plus packages/mcp-server and packages/sdk.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Runtime dependencies ship to users in @verifyax/mcp-server and
      # @verifyax/sdk, so keep them reviewable separately from tooling.
      #
      # Group only minor and patch updates. Majors arrive as individual PRs,
      # because grouping them means one breaking change blocks every harmless
      # bump beside it and there is no way to split the group to find out which:
      # #49 and #65 both bundled a TypeScript major that breaks the SDK type
      # codegen together with seven updates that were fine.
      production:
        dependency-type: production
        patterns: ['*']
        update-types: ['minor', 'patch']
      development:
        dependency-type: development
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node majors are a deliberate choice, not a bump. Only even majors reach
      # LTS, and not until the October after release, so "newest" is routinely
      # the wrong answer for a runtime image -- Dependabot offered 26 (Current)
      # twice, and it broke the build both times because corepack is unbundled
      # there. Patch and minor updates on the LTS line still flow, which is what
      # carries security fixes.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /deploy/gcp
    schedule:
      interval: weekly
    ignore:
      # Node majors are a deliberate choice, not a bump. Only even majors reach
      # LTS, and not until the October after release, so "newest" is routinely
      # the wrong answer for a runtime image -- Dependabot offered 26 (Current)
      # twice, and it broke the build both times because corepack is unbundled
      # there. Patch and minor updates on the LTS line still flow, which is what
      # carries security fixes.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
