name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      # Minimum supported Node (engines: >=20), the previous LTS, and the LTS the
      # runtime images ship on — so the version we deploy is a version we test.
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Check version consistency
        # On a tag build, also assert the tag matches the package version.
        run: pnpm check:versions
        env:
          EXPECT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Check generated SDK types + spec provenance are in sync with the mirror
        # Regenerate from packages/sdk/openapi/verifyax.yaml and fail if the
        # committed types.gen.ts or verifyax.meta.json drifted. Keeps the spec the
        # single source of truth and the recorded spec version/hash honest.
        run: |
          pnpm gen:types
          pnpm gen:spec-meta
          git diff --exit-code -- packages/sdk/src/types.gen.ts packages/sdk/openapi/verifyax.meta.json \
            || (echo "::error::Generated SDK artifacts are stale — run 'pnpm gen:types && pnpm gen:spec-meta' and commit." && exit 1)

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build (type-checks via tsc -b project references)
        run: pnpm build

      - name: Unit tests (with coverage thresholds)
        run: pnpm test:coverage

      - name: Conformance test (spawns the built MCP server)
        run: pnpm test:conformance

  docker:
    name: Build runtime images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nothing else in CI builds these, and three separate changes broke them
      # without a single red check: the node 26 bumps (corepack is absent from
      # 26-slim) and the prod-tree rework. A base image or dependency change
      # that cannot produce a runnable image should not merge green.
      - name: Build both Dockerfiles
        run: |
          docker build -t cvx-mcp:ci -f Dockerfile .
          docker build -t cvx-mcp-gcp:ci -f deploy/gcp/Dockerfile .

      - name: The image must actually run
        run: |
          # The workspace dependency is the fragile part: @verifyax/sdk has to be
          # materialised into the pruned tree, not left as a dangling symlink.
          # Test the built entrypoint directly -- the package is ESM-only with
          # subpath exports, so require.resolve() on the bare specifier throws
          # ERR_PACKAGE_PATH_NOT_EXPORTED even when it is correctly installed.
          docker run --rm --entrypoint sh cvx-mcp-gcp:ci             -c 'test -s /app/packages/mcp-server/node_modules/@verifyax/sdk/dist/index.js'             || { echo "@verifyax/sdk is not materialised in the runtime tree"; exit 1; }
          # devDependencies must not reach the runtime image.
          if docker run --rm --entrypoint sh cvx-mcp-gcp:ci                -c 'test -d /app/packages/mcp-server/node_modules/vitest'; then
            echo "devDependencies leaked into the runtime image"; exit 1
          fi
          # HTTP server starts and serves /health.
          cid=$(docker run -d -p 8080:8080 -e VERIFYAX_API_KEY=dummy                   -e VERIFYAX_MCP_ALLOWED_HOSTS=localhost cvx-mcp-gcp:ci)
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          docker logs "$cid" | tail -5
          docker rm -f "$cid" >/dev/null
          [ "${ok:-}" = "1" ] || { echo "/health never became ready"; exit 1; }
          echo "runtime image OK"
