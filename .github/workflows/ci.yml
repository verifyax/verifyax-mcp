name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      # Exercise the minimum supported Node (engines: >=20) as well as current.
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Check version consistency
        # On a tag build, also assert the tag matches the package version.
        run: pnpm check:versions
        env:
          EXPECT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Check generated SDK types + spec provenance are in sync with the mirror
        # Regenerate from packages/sdk/openapi/verifyax.yaml and fail if the
        # committed types.gen.ts or verifyax.meta.json drifted. Keeps the spec the
        # single source of truth and the recorded spec version/hash honest.
        run: |
          pnpm gen:types
          pnpm gen:spec-meta
          git diff --exit-code -- packages/sdk/src/types.gen.ts packages/sdk/openapi/verifyax.meta.json \
            || (echo "::error::Generated SDK artifacts are stale — run 'pnpm gen:types && pnpm gen:spec-meta' and commit." && exit 1)

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build (type-checks via tsc -b project references)
        run: pnpm build

      - name: Unit tests (with coverage thresholds)
        run: pnpm test:coverage

      - name: Conformance test (spawns the built MCP server)
        run: pnpm test:conformance
