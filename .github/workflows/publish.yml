name: Publish

# Manual, opt-in publishing from an immutable tag after that tag's CI passes.
# A real run publishes npm first and then creates the GitHub Release, whose
# release event triggers the MCP Registry workflow.
#
# Auth is npm Trusted Publishing (OIDC): both packages list this repo + workflow as a
# trusted publisher on npmjs.com, so no NPM_TOKEN secret and no OTP are involved. The
# token path died with EOTP once the account required 2FA for writes (see v0.3.2/v0.3.3
# release attempts); do not reintroduce NODE_AUTH_TOKEN — with OIDC configured it is
# unnecessary. pnpm publish delegates to the npm CLI, which must be >= 11.5.1 for OIDC
# (Node 22 ships npm 10; without upgrading, PUT returns E404).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Immutable release tag (vX.Y.Z)'
        type: string
        required: true
      dry_run:
        description: 'Run pnpm publish in --dry-run mode (no upload)'
        type: boolean
        default: true

permissions:
  actions: read
  contents: write
  # Required for npm provenance (OIDC) on the real publish.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # npm Trusted Publishing requires npm CLI >= 11.5.1 (bundled with Node 24).
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Verify immutable tag and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag must use the vX.Y.Z format"; exit 1 ;;
          esac
          [ "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG" ] || {
            echo "::error::Checked-out commit is not exactly tagged $RELEASE_TAG."
            exit 1
          }
          RELEASE_SHA=$(git rev-parse HEAD)
          SUCCESSFUL_RUNS=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$RELEASE_SHA" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq 'length')
          [ "$SUCCESSFUL_RUNS" -ge 1 ] || {
            echo "::error::The release tag's CI workflow has not completed successfully."
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version consistency
        run: pnpm check:versions
        env:
          EXPECT_VERSION: ${{ inputs.tag }}

      - name: Check generated SDK artifacts
        run: |
          pnpm gen:types
          pnpm gen:spec-meta
          git diff --exit-code -- packages/sdk/src/types.gen.ts packages/sdk/openapi/verifyax.meta.json

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:coverage

      - name: Conformance test
        run: pnpm test:conformance

      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        run: pnpm -r publish --access public --no-git-checks --dry-run

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: pnpm -r publish --access public --no-git-checks --provenance

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
