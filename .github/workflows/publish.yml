name: Publish

# npm Trusted Publishing (OIDC) — see docs/releasing.md. Manual dispatch still supports
# dry-run rehearsal. A green push to main with a new package version auto-publishes, tags,
# and creates the GitHub Release, then uploads neo-release for the MCP Registry workflow
# (GITHUB_TOKEN releases do not start other workflows).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Immutable release tag (vX.Y.Z)'
        type: string
        required: true
      dry_run:
        description: 'Run pnpm publish in --dry-run mode (no upload)'
        type: boolean
        default: true
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && format('tag-{0}', inputs.tag) || 'main-auto' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.repository.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve publish action
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG="$INPUT_TAG"
            case "$RELEASE_TAG" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::tag must use the vX.Y.Z format"; exit 1 ;;
            esac
            echo "action=dispatch" >> "$GITHUB_OUTPUT"
            echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
            echo "package_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${INPUT_DRY_RUN}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHA="$WORKFLOW_RUN_HEAD_SHA"
          if [[ ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "action=skip" >> "$GITHUB_OUTPUT"
            echo "skip_reason=invalid_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TIP="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "$SHA" != "$TIP" ]; then
            echo "action=skip" >> "$GITHUB_OUTPUT"
            echo "skip_reason=stale_main_tip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="$(jq -r '.version' packages/mcp-server/package.json)"
          RELEASE_TAG="v${VERSION}"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"

          ON_NPM=false
          if npm view "@verifyax/mcp-server@${VERSION}" version >/dev/null 2>&1; then
            ON_NPM=true
          fi
          ON_RELEASE=false
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            ON_RELEASE=true
          fi

          if [ "$ON_NPM" = true ] && [ "$ON_RELEASE" = true ]; then
            echo "action=skip" >> "$GITHUB_OUTPUT"
            echo "skip_reason=already_published" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ON_NPM" = true ] && [ "$ON_RELEASE" = false ]; then
            echo "action=release_only" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "action=full_publish" >> "$GITHUB_OUTPUT"

      - name: Skip
        if: steps.gate.outputs.action == 'skip'
        env:
          SKIP_REASON: ${{ steps.gate.outputs.skip_reason }}
        run: |
          echo "Nothing to publish (${SKIP_REASON})."
          exit 0

      - name: Verify immutable tag and successful CI (manual dispatch)
        if: steps.gate.outputs.action == 'dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.gate.outputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag must use the vX.Y.Z format"; exit 1 ;;
          esac
          [ "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG" ] || {
            echo "::error::Checked-out commit is not exactly tagged $RELEASE_TAG."
            exit 1
          }
          RELEASE_SHA=$(git rev-parse HEAD)
          SUCCESSFUL_RUNS=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$RELEASE_SHA" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq 'length')
          [ "$SUCCESSFUL_RUNS" -ge 1 ] || {
            echo "::error::The release tag's CI workflow has not completed successfully."
            exit 1
          }

      - name: Install dependencies
        if: steps.gate.outputs.action != 'skip'
        run: pnpm install --frozen-lockfile

      - name: Check version consistency
        if: steps.gate.outputs.action != 'skip'
        run: pnpm check:versions
        env:
          EXPECT_VERSION: ${{ steps.gate.outputs.release_tag }}

      - name: Check generated SDK artifacts
        if: steps.gate.outputs.action == 'dispatch' || steps.gate.outputs.action == 'full_publish'
        run: |
          pnpm gen:types
          pnpm gen:spec-meta
          git diff --exit-code -- packages/sdk/src/types.gen.ts packages/sdk/openapi/verifyax.meta.json

      - name: Lint
        if: steps.gate.outputs.action == 'dispatch' || steps.gate.outputs.action == 'full_publish'
        run: pnpm lint

      - name: Check formatting
        if: steps.gate.outputs.action == 'dispatch' || steps.gate.outputs.action == 'full_publish'
        run: pnpm format:check

      - name: Audit production dependencies
        if: steps.gate.outputs.action == 'dispatch' || steps.gate.outputs.action == 'full_publish'
        run: pnpm audit:prod

      - name: Build
        if: steps.gate.outputs.action == 'dispatch' || steps.gate.outputs.action == 'full_publish'
        run: pnpm build

      - name: Unit tests
        if: steps.gate.outputs.action == 'dispatch' || steps.gate.outputs.action == 'full_publish'
        run: pnpm test:coverage

      - name: Conformance test
        if: steps.gate.outputs.action == 'dispatch' || steps.gate.outputs.action == 'full_publish'
        run: pnpm test:conformance

      - name: Publish (dry run, manual)
        if: steps.gate.outputs.action == 'dispatch' && steps.gate.outputs.dry_run == 'true'
        run: pnpm -r publish --access public --no-git-checks --dry-run

      - name: Publish
        if: >-
          (steps.gate.outputs.action == 'dispatch' && steps.gate.outputs.dry_run == 'false') ||
          steps.gate.outputs.action == 'full_publish'
        run: pnpm -r publish --access public --no-git-checks --provenance

      - name: Create git tag (main auto)
        if: steps.gate.outputs.action == 'full_publish'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.gate.outputs.release_tag }}
        run: |
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists."
          else
            git tag "$RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Create GitHub Release
        if: >-
          steps.gate.outputs.action == 'release_only' ||
          (steps.gate.outputs.action == 'dispatch' && steps.gate.outputs.dry_run == 'false') ||
          steps.gate.outputs.action == 'full_publish'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.gate.outputs.release_tag }}
          GATE_ACTION: ${{ steps.gate.outputs.action }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          elif [ "$GATE_ACTION" = "dispatch" ]; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi

      - name: Write neo-release metadata
        if: >-
          steps.gate.outputs.action == 'release_only' ||
          (steps.gate.outputs.action == 'dispatch' && steps.gate.outputs.dry_run == 'false') ||
          steps.gate.outputs.action == 'full_publish'
        env:
          PACKAGE_VERSION: ${{ steps.gate.outputs.package_version }}
        run: |
          VERSION="$PACKAGE_VERSION"
          SHA="$(git rev-parse HEAD)"
          jq -n --arg version "$VERSION" --arg sha "$SHA" \
            '{version:$version,sha:$sha}' > neo-release.json
          cat neo-release.json

      - name: Upload neo-release artifact
        if: >-
          steps.gate.outputs.action == 'release_only' ||
          (steps.gate.outputs.action == 'dispatch' && steps.gate.outputs.dry_run == 'false') ||
          steps.gate.outputs.action == 'full_publish'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neo-release
          path: neo-release.json
          retention-days: 30
