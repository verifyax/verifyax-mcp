# Runtime settings mirrored from verification
# infra/GCP-NEO/applications/verifyax-mcp/values-dev.yaml
# (replicas, allowed_hosts, log_level, service_port, resources).
# Gateway URLs are not in that Terraform template; this file is what the
# kubectl rollout sets on verifyax-mcp-dev.
environment: dev
gcp_project: verifyax-dev
gke_cluster: verifyax-dev
gke_region: europe-west2
namespace: verifyax-mcp-dev
deployment: verifyax-mcp-dev
container: verifyax-mcp
registry_image: europe-west2-docker.pkg.dev/verifyax-core/verifyax-docker/verifyax-mcp
replicas: 1
allowed_hosts: verifyax-mcp.dev.conscium.ai,verifyax-mcp.dev.neo.conscium.ai
log_level: debug
service_port: '8080'
requests_cpu: 250m
requests_memory: 256Mi
limits_memory: 512Mi
verifyax_base_url: https://webapp.dev.neo.conscium.ai/api/v1
verifyax_web_base_url: https://webapp.dev.neo.conscium.ai/web/api/v1
health_url: https://verifyax-mcp.dev.neo.conscium.ai/health
