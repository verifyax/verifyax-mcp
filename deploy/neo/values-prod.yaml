# Runtime settings mirrored from verification
# infra/GCP-NEO/applications/verifyax-mcp/values-prod.yaml
# (replicas, allowed_hosts, log_level, service_port, resources).
# Gateway URLs are not in that Terraform template; this file is what the
# kubectl rollout sets on verifyax-mcp-prod.
environment: prod
gcp_project: verifyax-prod
gke_cluster: verifyax-prod
gke_region: europe-west2
namespace: verifyax-mcp-prod
deployment: verifyax-mcp-prod
container: verifyax-mcp
registry_image: europe-west2-docker.pkg.dev/verifyax-core/verifyax-docker/verifyax-mcp
replicas: 1
allowed_hosts: mcp.verifyax.com,verifyax-mcp.prod.conscium.ai,verifyax-mcp.prod.neo.conscium.ai
log_level: info
service_port: '8080'
requests_cpu: 250m
requests_memory: 256Mi
limits_memory: 512Mi
verifyax_base_url: https://console.verifyax.com/api/v1
verifyax_web_base_url: https://console.verifyax.com/web/api/v1
health_url: https://verifyax-mcp.prod.neo.conscium.ai/health
